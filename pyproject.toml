[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-optimizer"
version = "0.2.0"
description = "MVP intelligent image optimization toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
imaging = ["Pillow>=10.0.0"]

[project.scripts]
aio = "ai_image_optimizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
